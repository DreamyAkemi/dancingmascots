<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Content-Security-Policy: only our own script, no network, no inline script. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; user-select: none; }

  /* #bounce scales from the bottom edge for the beat effect; #view inside it handles flipping. */
  #bounce { position: absolute; inset: 0; transform-origin: 50% 100%; will-change: transform; }
  #view { width: 100%; height: 100%; cursor: grab; }
  #view.flip { transform: scaleX(-1); }
  #view:active { cursor: grabbing; }

  /* Dashed outline + resize grip appear only while the mouse is over the mascot. */
  #frame { position: absolute; inset: 0; border: 2px dashed transparent; border-radius: 6px; pointer-events: none; transition: border-color .15s; }
  body:hover #frame { border-color: rgba(255, 255, 255, .55); }
  #grip { position: absolute; right: 0; bottom: 0; width: 18px; height: 18px; cursor: nwse-resize; opacity: 0; transition: opacity .15s;
          background: linear-gradient(135deg, transparent 50%, rgba(255,255,255,.9) 50%, rgba(255,255,255,.9) 58%, transparent 58%, transparent 72%, rgba(255,255,255,.9) 72%, rgba(255,255,255,.9) 80%, transparent 80%);
          filter: drop-shadow(0 0 2px #000); }
  body:hover #grip { opacity: 1; }
  body.locked #grip, body.locked #frame { display: none; } /* click-through mode: hide the UI chrome */
</style>
</head>
<body>
  <div id="bounce"><canvas id="view"></canvas></div>
  <div id="frame"></div>
  <div id="grip"></div>
  <script src="overlay.js"></script>
</body>
</html>
