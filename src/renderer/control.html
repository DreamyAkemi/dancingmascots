<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Dancing Mascots</title>
<link rel="stylesheet" href="control.css">
</head>
<body>
  <header>
    <div id="bpm"><span id="bpmValue">--</span><small>BPM</small></div>
    <div id="status"><span id="dot"></span><span id="statusText">Starting…</span></div>
  </header>

  <section>
    <h2>Tempo</h2>
    <label class="row">Audio source
      <select id="audioSource"></select>
    </label>
    <div class="row">
      <label><input type="radio" name="mode" value="auto"> Auto-detect</label>
      <label><input type="radio" name="mode" value="manual"> Manual</label>
      <input id="manualBpm" type="number" min="40" max="240" step="1" title="Manual BPM">
      <button id="tap" title="Tap along to set the BPM">Tap</button>
    </div>
    <div class="row">Detection looks wrong?
      <span class="seg" id="octave">
        <button data-v="0.5">½×</button><button data-v="1">1×</button><button data-v="2">2×</button>
      </span>
    </div>
    <label class="row">All mascots speed
      <input id="globalSpeed" type="range" min="0.25" max="3" step="0.05">
      <output id="globalSpeedOut"></output>
    </label>
  </section>

  <section>
    <h2>Mascots <button id="add">+ Add GIFs</button></h2>
    <div id="drop">Drop .gif files here</div>
    <div id="list"></div>
  </section>

  <footer>
    <label><input type="checkbox" id="locked"> Lock overlays (click-through)</label>
    <button id="reset">Reset positions</button>
  </footer>
  <script src="control.js"></script>
</body>
</html>
