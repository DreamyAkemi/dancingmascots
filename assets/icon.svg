  <path d="M278 276q22-26 44 0" fill="none" stroke="#2b1b5e" stroke-width="16" stroke-linecap="round"/>
  <path d="M236 340h40l-20 24z" fill="#2b1b5e" stroke="#2b1b5e" stroke-width="10" stroke-linejoin="round"/>

  <!-- ear cups (in front, at the sides of the head) -->
  <rect x="76" y="200" width="64" height="112" rx="30" fill="#2b1b5e"/>
  <rect x="372" y="200" width="64" height="112" rx="30" fill="#2b1b5e"/>
  <rect x="98" y="222" width="20" height="68" rx="10" fill="#ff7ac0"/>
  <rect x="394" y="222" width="20" height="68" rx="10" fill="#ff7ac0"/>
